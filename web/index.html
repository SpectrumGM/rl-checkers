<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaZero Checkers</title>
<style>
  :root {
    --bg: #1c1a17; --panel: #26231f; --line: #3a352e; --text: #ece6dc; --muted: #a39a8c;
    --dark: #8b5a2b; --light: #deb887; --frame: #3c1e0a;
    --white-piece: #fff8f0; --white-edge: #c8beaf; --black-piece: #2a2826; --black-edge: #111;
    --gold: #daa520; --sel: rgba(255, 255, 100, .55); --target: rgba(100, 200, 100, .75);
    --last: rgba(80, 160, 220, .45); --accent: #e0a85a;
    --win: #5fb36a; --lose: #d9645a; --draw: #c9b27a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 40px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; }
  header p { margin: 6px 0 22px; color: var(--muted); max-width: 640px; }
  header a { color: var(--accent); }
  .layout { display: grid; grid-template-columns: auto minmax(260px, 340px); gap: 24px; align-items: start; }
  .boardcol { --sq: min(64px, calc((100vw - 70px) / 8)); }
  .play { display: flex; gap: 10px; }
  .evalbar { width: 18px; border-radius: 4px; overflow: hidden; background: var(--black-piece);
             border: 1px solid var(--line); position: relative; }
  .evalbar .w { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: var(--white-piece);
                transition: height .35s ease; }
  .evalbar.flip .w { bottom: auto; top: 0; }
  .boardwrap { position: relative; }
  .board { display: grid; grid-template-columns: repeat(8, var(--sq)); grid-template-rows: repeat(8, var(--sq));
           border: 6px solid var(--frame); border-radius: 4px; user-select: none; }
  .board.idle { opacity: .55; }
  .board.thinking { cursor: progress; }
  .sq { position: relative; display: grid; place-items: center; }
  .sq.l { background: var(--light); } .sq.d { background: var(--dark); }
  .sq.last::before, .sq.sel::before, .sq.target::before { content: ""; position: absolute; inset: 0; }
  .sq.last::before { background: var(--last); }
  .sq.sel::before { background: var(--sel); }
  .sq.target { cursor: pointer; }
  .sq.target::before { inset: 34%; border-radius: 50%; background: var(--target); }
  .sq.movable { cursor: pointer; }
  .pc { position: relative; width: 78%; height: 78%; border-radius: 50%; z-index: 1;
        display: grid; place-items: center; font-size: calc(var(--sq) * .38); color: var(--gold); }
  .pc.w { background: radial-gradient(circle at 35% 30%, #fff, var(--white-piece) 55%, var(--white-edge));
          box-shadow: 0 2px 0 var(--white-edge), 0 3px 6px rgba(0,0,0,.4); }
  .pc.b { background: radial-gradient(circle at 35% 30%, #555, var(--black-piece) 55%, var(--black-edge));
          box-shadow: 0 2px 0 #000, 0 3px 6px rgba(0,0,0,.5); }
  .coords { display: grid; grid-template-columns: repeat(8, var(--sq)); color: var(--muted); font-size: 11px;
            text-align: center; padding: 4px 0 0 34px; }

  /* small "thinking" dots in the board corner while the engine moves */
  .dots { position: absolute; right: 12px; bottom: 12px; z-index: 3; display: none; gap: 5px;
          background: rgba(28, 26, 23, .8); padding: 6px 9px; border-radius: 12px; }
  .dots.on { display: flex; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: blink 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 50% { opacity: .2; } }

  /* result overlay */
  .result { position: absolute; inset: 6px; z-index: 4; display: none; place-items: center;
            background: rgba(20, 18, 16, .62); border-radius: 2px; }
  .result.on { display: grid; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 34px 22px;
          text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.45); min-width: 220px; }
  .card svg { width: 64px; height: 64px; display: block; margin: 0 auto 10px; }
  .card .ttl { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
  .card .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .card.win .ttl { color: var(--win); } .card.lose .ttl { color: var(--lose); } .card.draw .ttl { color: var(--draw); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .panel h2 { margin: 0 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  select, button { font: inherit; color: var(--text); background: #1f1d1a; border: 1px solid var(--line);
                   border-radius: 7px; padding: 9px 10px; width: 100%; }
  .field { margin-bottom: 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1c1a17; font-weight: 600;
                   cursor: pointer; margin-top: 4px; }
  button.primary:hover { filter: brightness(1.07); }
  button.primary:active { transform: translateY(1px); }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>AlphaZero Checkers</h1>
    <p>Play against a checkers engine that taught itself with a neural network and Monte Carlo Tree Search,
       or against classic minimax opponents for comparison.
       <a href="https://github.com/SpectrumGM/rl-checkers">Source on GitHub</a></p>
  </header>

  <div class="layout">
    <div class="boardcol">
      <div class="play">
        <div class="evalbar" id="evalbar" title="Neural network evaluation (white = good for White)"><div class="w" id="evalw"></div></div>
        <div class="boardwrap">
          <div class="board idle" id="board"></div>
          <div class="dots" id="dots"><i></i><i></i><i></i></div>
          <div class="result" id="result">
            <div class="card" id="card">
              <div id="icon"></div>
              <div class="ttl" id="rtitle"></div>
              <div class="sub" id="rsub"></div>
              <button class="primary" id="again">Play again</button>
            </div>
          </div>
        </div>
      </div>
      <div class="coords" id="files"></div>
    </div>

    <div class="panel">
      <h2>New game</h2>
      <div class="field">
        <label for="opp">Opponent</label>
        <select id="opp">
          <option value="alphazero">AlphaZero</option>
          <option value="network">Network only</option>
          <option value="minimax1">Minimax depth 1</option>
          <option value="minimax2">Minimax depth 2</option>
          <option value="minimax3">Minimax depth 3</option>
          <option value="minimax4">Minimax depth 4</option>
          <option value="minimax5">Minimax depth 5</option>
          <option value="random">Random</option>
        </select>
      </div>
      <div class="field">
        <label for="side">You play</label>
        <select id="side">
          <option value="1">White</option>
          <option value="-1">Black</option>
        </select>
      </div>
      <button class="primary" id="newbtn">Start game</button>
    </div>
  </div>
</main>

<script>
const FILES = "abcdefgh";
const ICONS = {
  win:  '<svg viewBox="0 0 64 64" fill="none" stroke="#5fb36a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10h24v14a12 12 0 0 1-24 0z"/><path d="M20 15H11a8 8 0 0 0 9 11M44 15h9a8 8 0 0 1-9 11"/><path d="M32 36v10M22 54h20M26 46h12"/></svg>',
  lose: '<svg viewBox="0 0 64 64" fill="none" stroke="#d9645a" stroke-width="4" stroke-linecap="round"><circle cx="32" cy="32" r="24"/><path d="M22 22l20 20M42 22L22 42"/></svg>',
  draw: '<svg viewBox="0 0 64 64" fill="none" stroke="#c9b27a" stroke-width="4" stroke-linecap="round"><circle cx="32" cy="32" r="24"/><path d="M21 27h22M21 37h22"/></svg>',
};
let S = null;                 // server response: state, legal_moves, winner, eval
let started = false, human = 1, opponent = "alphazero", selected = null, lastSquares = [], busy = false;

const $ = id => document.getElementById(id);
const flipped = () => human === -1;

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}

function render() {
  const board = $("board");
  board.innerHTML = "";
  board.classList.toggle("idle", !started);
  board.classList.toggle("thinking", busy);
  $("dots").classList.toggle("on", busy);

  const myTurn = started && S && S.winner === null && S.state.current_player === human && !busy;
  const fromSet = new Set(myTurn ? S.legal_moves.map(m => m[0][0] + "," + m[0][1]) : []);
  const targets = new Set(selected && myTurn
      ? S.legal_moves.filter(m => m[0][0] === selected[0] && m[0][1] === selected[1])
                     .map(m => m[m.length - 1][2] + "," + m[m.length - 1][3]) : []);

  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    const r = flipped() ? 7 - i : i, c = flipped() ? 7 - j : j;
    const key = r + "," + c;
    const d = document.createElement("div");
    d.className = "sq " + ((r + c) % 2 ? "d" : "l");
    if (lastSquares.includes(key)) d.classList.add("last");
    if (selected && selected[0] === r && selected[1] === c) d.classList.add("sel");
    if (targets.has(key)) d.classList.add("target");
    if (fromSet.has(key)) d.classList.add("movable");
    const p = S ? S.state.board[r][c] : 0;
    if (p) {
      const pc = document.createElement("div");
      pc.className = "pc " + (p > 0 ? "w" : "b");
      if (Math.abs(p) === 2) pc.textContent = "♛";
      d.appendChild(pc);
    }
    d.onclick = () => click(r, c, fromSet, targets);
    board.appendChild(d);
  }

  $("files").innerHTML = [...Array(8)].map((_, j) => `<span>${FILES[flipped() ? 7 - j : j]}</span>`).join("");
  const ev = S && started ? S.eval : 0;
  $("evalw").style.height = (50 + 50 * ev) + "%";
  $("evalbar").classList.toggle("flip", flipped());
  $("evalbar").style.height = board.offsetHeight + "px";
}

function showResult() {
  if (!S || S.winner === null) return false;
  const kind = S.winner === 0 ? "draw" : (S.winner === human ? "win" : "lose");
  const name = $("opp").options[$("opp").selectedIndex].text;
  $("card").className = "card " + kind;
  $("icon").innerHTML = ICONS[kind];
  $("rtitle").textContent = { win: "Victory", lose: "Defeat", draw: "Draw" }[kind];
  $("rsub").textContent = { win: `You beat ${name}`, lose: `${name} won`,
                            draw: "40 moves without a capture" }[kind];
  $("result").classList.add("on");
  return true;
}

function markLast(m) { lastSquares = [m[0][0] + "," + m[0][1], ...m.map(s => s[2] + "," + s[3])]; }

async function aiTurn() {
  busy = true; render();
  try {
    S = await api("/api/ai", { state: S.state, opponent });
    markLast(S.ai_move);
  } catch (e) { alert("Server error: " + e.message); }
  busy = false; render();
  showResult();
}

async function click(r, c, fromSet, targets) {
  if (!started || busy || !S || S.winner !== null || S.state.current_player !== human) return;
  const key = r + "," + c;
  if (fromSet.has(key)) { selected = [r, c]; render(); return; }
  if (selected && targets.has(key)) {
    const move = S.legal_moves.find(m => m[0][0] === selected[0] && m[0][1] === selected[1]
                                         && m[m.length - 1][2] === r && m[m.length - 1][3] === c);
    selected = null; busy = true;
    try { S = await api("/api/move", { state: S.state, move }); }
    catch (e) { alert("Server error: " + e.message); busy = false; render(); return; }
    busy = false;
    markLast(move);
    render();
    if (!showResult()) await aiTurn();
  }
}

async function newGame() {
  human = +$("side").value;
  opponent = $("opp").value;
  selected = null; lastSquares = [];
  $("result").classList.remove("on");
  $("newbtn").textContent = "Restart game";
  busy = true; render();
  try { S = await api("/api/new"); }
  catch (e) { alert("Server error: " + e.message); busy = false; render(); return; }
  started = true; busy = false; render();
  if (human === -1) await aiTurn();     // engine plays White and moves first
}

async function preview() {
  // show the starting position (inactive) until the player presses Start game
  try { S = await api("/api/new"); } catch (e) { S = null; }
  render();
}

$("newbtn").onclick = newGame;
$("again").onclick = newGame;
$("side").onchange = () => { if (!started) { human = +$("side").value; render(); } };
window.addEventListener("resize", render);
preview();
</script>
</body>
</html>
